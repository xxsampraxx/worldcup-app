<!DOCTYPE html>
<html>
<head>
  <title>World Cup Fixtures</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      background: #0b0f1a;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 { color: #00ffcc; }

    .box {
      background: #1a2233;
      margin: 10px 0;
      padding: 15px;
      border-radius: 12px;
    }

    .match {
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    .time {
      color: #00ffcc;
      font-size: 12px;
    }
  </style>
</head>
<body>

<h1>⚽ World Cup Fixtures</h1>

<div class="box">
  <h2>📅 Today</h2>
  <p id="today"></p>
</div>

<div class="box">
  <h2>🏟 Fixtures</h2>

  <div class="match">
    <b>Qatar vs Ecuador</b><br>
    <span class="time">Opening Match</span>
  </div>

  <div class="match">
    <b>England vs USA</b><br>
    <span class="time">Group Stage</span>
  </div>

  <div class="match">
    <b>Argentina vs Mexico</b><br>
    <span class="time">Group Stage</span>
  </div>

  <div class="match">
    <b>France vs Denmark</b><br>
    <span class="time">Group Stage</span>
  </div>

</div>

<script>
document.getElementById("today").innerText =
  new Date().toDateString();
</script>

</body>
</html>

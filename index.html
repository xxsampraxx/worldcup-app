<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-weight/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-between">
            <h1 class="text-2xl font-bold text-black-500"><i class="fas fa-trophy text-yellow-500 mr-2"></i>WC Hub</h1>
            <button onclick="refreshData()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
                <i class="fas fa-sync-alt mr-1"></i> Refresh
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="lg:col-span-2 space-y-6">
            <section class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                <h2 class="text-xl font-bold mb-4 flex items-center text-red-500">
                    <span class="animate-ping inline-block w-3 h-3 bg-red-500 rounded-full mr-2"></span> Live Matches
                </h2>
                <div id="live-matches" class="space-y-4">
                    <p class="text-gray-400 text-sm">No live matches right now. Check back during gametime!</p>
                </div>
            </section>

            <section class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                <h2 class="text-xl font-bold mb-4 text-blue-400"><i class="fas fa-calendar-alt mr-2"></i>Upcoming Fixtures</h2>
                <div id="fixtures" class="space-y-3">
                    <div class="bg-gray-700/50 p-4 rounded-lg flex justify-between items-center">
                        <span class="font-medium">USA 🇺🇸</span>
                        <span class="bg-gray-600 px-3 py-1 rounded text-xs font-mono">18:00 UTC</span>
                        <span class="font-medium">ENG 🏴󠁧󠁢󠁥󠁮󠁧󠁿</span>
                    </div>
                </div>
            </section>
        </div>

        <div class="lg:col-span-1">
            <section class="bg-gray-800 p-6 rounded-xl border border-gray-700 h-full">
                <h2 class="text-xl font-bold mb-4 text-green-400"><i class="fas fa-newspaper mr-2"></i>Latest News</h2>
                <div id="news-feed" class="space-y-4">
                    <p class="text-gray-400 text-sm">Loading latest football updates...</p>
                </div>
            </section>
        </div>

    </main>

    <script>
        // REPLACE THESE WITH YOUR FREE API KEYS
        const FOOTBALL_API_KEY = 158c37714del540823d2894ffd7e5291; 
        const NEWS_API_KEY = f3033874a0b14e6c9a42e506679871c1;

        async function fetchLiveScores() {
            try {
                // Using API-Football endpoint (Example: Live matches for World Cup League ID)
                // Note: Replace with real endpoint & correct league ID when active
                const response = await fetch('https://v3.football.api-sports.io/fixtures?live=all', {
                    headers: { 'x-rapidapi-key': FOOTBALL_API_KEY, 'x-rapidapi-host': 'v3.football.api-sports.io' }
                });
                const data = await response.json();
                // Render data dynamically into HTML element #live-matches
            } catch (err) {
                console.log("Error fetching live scores:", err);
            }
        }

        async function fetchNews() {
            try {
                const response = await fetch(`https://gnews.io/api/v4/search?q=World+Cup+football&lang=en&token=${NEWS_API_KEY}`);
                const data = await response.json();
                const newsContainer = document.getElementById('news-feed');
                
                if(data.articles) {
                    newsContainer.innerHTML = data.articles.slice(0, 5).map(article => `
                        <div class="border-b border-gray-700 pb-3 last:border-0">
                            <a href="${article.url}" target="_blank" class="hover:text-blue-400 font-medium text-sm line-clamp-2">${article.title}</a>
                            <span class="text-xs text-gray-500">${new Date(article.publishedAt).toLocaleDateString()}</span>
                        </div>
                    `).join('');
                }
            } catch (err) {
                document.getElementById('news-feed').innerHTML = `<p class="text-red-400 text-sm">Failed to load news.</p>`;
            }
        }

        function refreshData() {
            fetchLiveScores();
            fetchNews();
        }

        // Run on initial load
        window.onload = () => {
            fetchNews();
            // fetchLiveScores(); // Uncomment once you plug in your API key
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-weight/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <!-- Header Navigation -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-yellow-500"><i class="fas fa-trophy mr-2"></i>WC Hub</h1>
            <div class="flex gap-2">
                <button onclick="toggleSettings()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm font-semibold transition">
                    <i class="fas fa-cog"></i> Settings
                </button>
                <button onclick="refreshData()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
                    <i class="fas fa-sync-alt mr-1"></i> Refresh
                </button>
            </div>
        </div>
    </header>

    <!-- Secure API Settings Modal/Panel -->
    <div id="settings-panel" class="hidden bg-gray-800 border-b border-gray-700 p-6 max-w-7xl mx-auto mt-4 rounded-xl">
        <h3 class="text-lg font-bold mb-3 text-yellow-500"><i class="fas fa-key mr-2"></i>Secure API Key Setup</h3>
        <p class="text-xs text-gray-400 mb-4">Keys are saved locally in your browser cache. They are never uploaded to GitHub.</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">API-Football Key</label>
                <input type="password" id="football-key-input" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="Paste API-Football key here">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">GNews API Key</label>
                <input type="password" id="news-key-input" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="Paste GNews key here">
            </div>
        </div>
        <button onclick="saveKeys()" class="mt-4 bg-green-600 hover:bg-green-700 px-4 py-2 rounded text-sm font-semibold transition">Save Keys</button>
    </div>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left & Center Columns: Live & Fixtures -->
        <div class="lg:col-span-2 space-y-6">
            <!-- Live Matches Section -->
            <section class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                <h2 class="text-xl font-bold mb-4 flex items-center text-red-500">
                    <span class="animate-ping inline-block w-3 h-3 bg-red-500 rounded-full mr-2"></span> Live Matches
                </h2>
                <div id="live-matches" class="space-y-4">
                    <p class="text-gray-400 text-sm">Loading live updates...</p>
                </div>
            </section>

            <!-- Upcoming Fixtures Section -->
            <section class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                <h2 class="text-xl font-bold mb-4 text-blue-400"><i class="fas fa-calendar-alt mr-2"></i>Upcoming Fixtures</h2>
                <div id="fixtures" class="space-y-3">
                    <p class="text-gray-400 text-sm">Loading tournament schedules...</p>
                </div>
            </section>
        </div>

        <!-- Right Column: News Feed -->
        <div class="lg:col-span-1">
            <section class="bg-gray-800 p-6 rounded-xl border border-gray-700 h-full">
                <h2 class="text-xl font-bold mb-4 text-green-400"><i class="fas fa-newspaper mr-2"></i>Latest News</h2>
                <div id="news-feed" class="space-y-4">
                    <p class="text-gray-400 text-sm">Loading latest football updates...</p>
                </div>
            </section>
        </div>

    </main>

    <script>
        // Toggle Settings Panel UI
        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('hidden');
        }

        // Save keys to Browser's Local Storage securely
        function saveKeys() {
            const footballKey = document.getElementById('football-key-input').value;
            const newsKey = document.getElementById('news-key-input').value;

            localStorage.setItem('FOOTBALL_API_KEY', footballKey);
            localStorage.setItem('NEWS_API_KEY', newsKey);

            alert('Keys saved successfully! Refreshing dashboard data...');
            toggleSettings();
            refreshData();
        }

        // Load keys back into inputs if they exist
        function loadSavedKeysUI() {
            document.getElementById('football-key-input').value = localStorage.getItem('FOOTBALL_API_KEY') || '';
            document.getElementById('news-key-input').value = localStorage.getItem('NEWS_API_KEY') || '';
        }

        async function fetchLiveScoresAndFixtures() {
            const apiKey = localStorage.getItem('FOOTBALL_API_KEY');
            if (!apiKey) {
                document.getElementById('live-matches').innerHTML = `<p class="text-yellow-500 text-sm">Please open Settings and add your API-Football Key.</p>`;
                document.getElementById('fixtures').innerHTML = `<p class="text-yellow-500 text-sm">Please open Settings and add your API-Football Key.</p>`;
                return;
            }

            try {
                // Fetch live fixtures globally (World Cup league ID changes based on the qualifiers vs. main tournament)
                const response = await fetch('https://v3.football.api-sports.io/fixtures?live=all', {
                    headers: { 'x-rapidapi-key': apiKey, 'x-rapidapi-host': 'v3.football.api-sports.io' }
                });
                const data = await response.json();
                
                const liveContainer = document.getElementById('live-matches');
                
                if (data.response && data.response.length > 0) {
                    liveContainer.innerHTML = data.response.map(match => `
                        <div class="bg-gray-700/40 p-4 rounded-lg flex justify-between items-center border-l-4 border-red-500">
                            <div class="flex items-center space-x-2">
                                <span class="font-bold">${match.teams.home.name}</span>
                                <span class="bg-red-600 text-white font-mono px-2 py-0.5 rounded text-sm">${match.goals.home}</span>
                            </div>
                            <span class="text-xs text-red-400 font-bold uppercase tracking-wider animate-pulse">${match.fixture.status.elapsed}' min</span>
                            <div class="flex items-center space-x-2">
                                <span class="bg-red-600 text-white font-mono px-2 py-0.5 rounded text-sm">${match.goals.away}</span>
                                <span class="font-bold">${match.teams.away.name}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    liveContainer.innerHTML = `<p class="text-gray-400 text-sm">No live matches streaming right now.</p>`;
                }

                // Fetch next 5 scheduled fixtures
                const fixtureResponse = await fetch('https://v3.football.api-sports.io/fixtures?next=5', {
                    headers: { 'x-rapidapi-key': apiKey, 'x-rapidapi-host': 'v3.football.api-sports.io' }
                });
                const fixtureData = await fixtureResponse.json();
                const fixtureContainer = document.getElementById('fixtures');

                if (fixtureData.response && fixtureData.response.length > 0) {
                    fixtureContainer.innerHTML = fixtureData.response.map(match => `
                        <div class="bg-gray-700/20 p-4 rounded-lg flex justify-between items-center text-sm">
                            <span class="w-1/3 text-left font-medium truncate">${match.teams.home.name}</span>
                            <span class="w-1/3 text-center bg-gray-700 px-3 py-1 rounded text-xs font-mono text-blue-400">
                                ${new Date(match.fixture.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                            </span>
                            <span class="w-1/3 text-right font-medium truncate">${match.teams.away.name}</span>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error(err);
                document.getElementById('live-matches').innerHTML = `<p class="text-red-400 text-sm">Error pulling live statistics.</p>`;
            }
        }

        async function fetchNews() {
            const apiKey = localStorage.getItem('NEWS_API_KEY');
            if (!apiKey) {
                document.getElementById('news-feed').innerHTML = `<p class="text-yellow-500 text-sm">Please open Settings and add your GNews API Key.</p>`;
                return;
            }

            try {
                const response = await fetch(`https://gnews.io/api/v4/search?q="World Cup" OR "FIFA"&lang=en&token=${apiKey}`);
                const data = await response.json();
                const newsContainer = document.getElementById('news-feed');
                
                if (data.articles && data.articles.length > 0) {
                    newsContainer.innerHTML = data.articles.slice(0, 6).map(article => `
                        <div class="border-b border-gray-700 pb-3 last:border-0 hover:bg-gray-700/20 p-2 rounded transition">
                            <a href="${article.url}" target="_blank" class="hover:text-blue-400 font-medium text-sm line-clamp-2">${article.title}</a>
                            <div class="flex justify-between items-center mt-1 text-xs text-gray-500">
                                <span>${article.source.name}</span>
                                <span>${new Date(article.publishedAt).toLocaleDateString()}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    newsContainer.innerHTML = `<p class="text-gray-400 text-sm">No recent news articles found.</p>`;
                }
            } catch (err) {
                document.getElementById('news-feed').innerHTML = `<p class="text-red-400 text-sm">Failed to load news.</p>`;
            }
        }

        function refreshData() {
            fetchLiveScoresAndFixtures();
            fetchNews();
        }

        // Run on initial page load
        window.onload = () => {
            loadSavedKeysUI();
            refreshData();
        };
    </script>
</body>
</html>

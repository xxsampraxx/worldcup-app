<!DOCTYPE html>
<html>
<head>
  <title>World Cup App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family: Arial;
      background:#0b0f1a;
      color:white;
      text-align:center;
    }

    header{
      background:#111a2e;
      padding:20px;
    }

    h1{color:#00ffcc;margin:0;}

    .box{
      background:#1a2233;
      margin:10px;
      padding:15px;
      border-radius:12px;
    }

    .match{
      padding:10px;
      border-bottom:1px solid #333;
    }

    .small{
      font-size:12px;
      color:#aaa;
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ World Cup Tracker</h1>
</header>

<div class="box">
  <h2>📅 Status</h2>
  <p id="status"></p>
</div>

<div class="box">
  <h2>🏟 Fixtures</h2>
  <div id="matches">Loading...</div>
</div>

<script>
document.getElementById("status").innerText =
  "Updated ✔ " + new Date().toDateString();

function load(){

  const fixtures = [
    {home:"Qatar", away:"Ecuador", time:"Opening Match"},
    {home:"England", away:"USA", time:"Group Stage"},
    {home:"Argentina", away:"Mexico", time:"Group Stage"},
    {home:"France", away:"Denmark", time:"Group Stage"},
    {home:"Brazil", away:"Serbia", time:"Group Stage"},
    {home:"Spain", away:"Germany", time:"Group Stage"}
  ];

  let html = "";

  fixtures.forEach(m=>{
    html += `
      <div class="match">
        <b>${m.home}</b> vs <b>${m.away}</b><br>
        <span class="small">${m.time}</span>
      </div>
    `;
  });

  document.getElementById("matches").innerHTML = html;
}

load();
setInterval(load,60000);
</script>

</body>
</html>

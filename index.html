
<!DOCTYPE html>
<html>
<head>
  <title>World Cup App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      background: #0b0f1a;
      color: white;
      text-align: center;
      padding: 20px;
    }
    h1 { color: #00ffcc; }
    .box {
      background: #1a2233;
      margin: 10px;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<h1>⚽ World Cup App</h1>

<div class="box">
  <h2>Status</h2>
  <p id="status"></p>
</div>

<div class="box">
  <h2>Matches</h2>
  <p>Brazil vs Germany (2 - 1)</p>
  <p>Argentina vs France (1 - 1)</p>
  <p>Spain vs Portugal (0 - 2)</p>
</div>

<script>
document.getElementById("status").innerText =
  "Working ✔ " + new Date().toDateString();
</script>

</body>
</html>
